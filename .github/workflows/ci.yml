name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      # golangci-lint-action v7+ is required for golangci-lint v2, which .golangci.yml is
      # written against; v6 rejects the version string outright. v9 moves to the Node 24
      # runtime, which the runners now demand.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6

      # make check runs fmt-check, vet, lint-layers, lint and test. golangci-lint is on PATH
      # from the step above, so the lint target runs for real here rather than skipping.
      - name: make check
        run: make check

      # The store runs many readers against one writer; that only proves anything under -race.
      - name: make test-race
        run: make test-race

      - name: build
        run: make build

  # The layering rules are the reason this repository can grow remote hosts and a GUI cheaply.
  # Prove the check actually fails, so it cannot rot into a no-op that always passes.
  lint-layers-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true

      - name: layering check rejects a deliberate violation
        run: |
          set -e
          mkdir -p internal/scheduler
          printf 'package scheduler\n\nimport _ "os/exec"\n' > internal/scheduler/violation.go
          if make lint-layers; then
            echo "::error::lint-layers passed on a deliberate os/exec violation"
            exit 1
          fi
          rm internal/scheduler/violation.go
          make lint-layers
          echo "layering check correctly failed, then passed"
